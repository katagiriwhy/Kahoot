services:
  app:
    container_name: go_app
    build: .
    environment:
      PORT: ":8080"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/postgres?sslmode=disable"
      JWT_SECRET: "kahoot2005"
      PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN:-http://localhost:8080}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-localhost}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - db

  frontend:
    container_name: frontend
    build: ./frontend
    environment:
      VITE_PUBLIC_BACKEND_ORIGIN: ${PUBLIC_BACKEND_ORIGIN:-http://localhost:8080}
      VITE_PUBLIC_API_PATH_PREFIX: ${PUBLIC_API_PATH_PREFIX:-}
      VITE_SAME_ORIGIN_NO_API_PREFIX: ${PUBLIC_SAME_ORIGIN_NO_API_PREFIX:-}
    ports:
      - "5173:5173"
    restart: always
    depends_on:
      - app

  db:
    container_name: postgres_container
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: {}

networks:
  default:
    driver: bridge

